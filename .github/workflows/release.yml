name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v21). Creates the tag if missing."
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: validate
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate installer / FEATURES / lock
        shell: pwsh
        run: ./scripts/Invoke-Validate.ps1

  test:
    name: test
    runs-on: windows-latest
    needs: validate
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Cache HellForge upstream clone
        uses: actions/cache@v4
        with:
          path: .upstream
          key: hellforge-${{ hashFiles('UPSTREAM.lock') }}
          restore-keys: |
            hellforge-
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Run LocalBackend tests
        shell: pwsh
        run: ./scripts/Invoke-CiTests.ps1 -KeepUpstream

  release:
    name: release
    runs-on: windows-latest
    needs: [validate, test]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $v = '${{ inputs.version }}'.Trim()
          } else {
            $v = $env:GITHUB_REF_NAME
          }
          if ($v -notmatch '^v\d+') { throw "Version must look like v21 (got: $v)" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release version $v"

      - name: Publish seed zip as GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $zip = Join-Path 'seed' "HellForge-LocalCoop_$v.zip"
          $sum = "$zip.sha256"
          if (-not (Test-Path $zip)) {
            throw "Missing $zip — put the release archive in seed/ before tagging $v"
          }
          if (-not (Test-Path $sum)) {
            $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash
            Set-Content -Path $sum -Value "$hash  $(Split-Path $zip -Leaf)" -Encoding ASCII
          }
          $notes = @"
          HellForge Local Co-op **$v**

          1. Close the game and HellForge.
          2. Run ``INSTALL.cmd`` from the zip (pick the HellForge folder if asked).
          3. Prefer ``HellForge-Portable.cmd`` for Spacewar peer-link.
          4. Same **$v** on every squad PC.

          SHA-256 is in the ``.sha256`` asset.
          "@
          # Retag / recreate is fine for the same version after a failed run
          $existing = gh release view $v 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $v --yes
          }
          $remoteTag = git ls-remote --tags origin "refs/tags/$v"
          if (-not $remoteTag) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag $v
            git push origin $v
          }
          gh release create $v $zip $sum --title "HellForge Local Co-op $v" --notes $notes
