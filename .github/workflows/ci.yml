name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: validate
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate installer / FEATURES / lock
        shell: pwsh
        run: ./scripts/Invoke-Validate.ps1

  test:
    name: test
    runs-on: windows-latest
    needs: validate
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache HellForge upstream clone
        uses: actions/cache@v4
        with:
          path: .upstream
          key: hellforge-${{ hashFiles('UPSTREAM.lock') }}
          restore-keys: |
            hellforge-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run LocalBackend tests (overlay on HellForge)
        shell: pwsh
        run: ./scripts/Invoke-CiTests.ps1 -KeepUpstream
